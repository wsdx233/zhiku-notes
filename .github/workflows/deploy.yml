name: 部署知库

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 安装依赖
        run: npm ci
      - name: 构建静态站点
        run: npm run build
      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布静态页面
        id: deployment
        uses: actions/deploy-pages@v4
